<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">E.V. system architecture</title>
<desc id="desc">A restrained diagram showing voice input, intelligence routing, authorization, capabilities, and trusted devices.</desc>
<rect width="960" height="540" rx="30" fill="#0b0d11"/>
<g fill="none" stroke="#252b35" stroke-width="1"><path d="M110 270H850"/><path d="M270 150V390"/><path d="M480 150V390"/><path d="M690 150V390"/></g>
<g font-family="Inter,system-ui,sans-serif">
<text x="72" y="74" fill="#a9b9ff" font-size="14" letter-spacing="3">E.V. / SYSTEM</text>
<text x="72" y="111" fill="#f2f4f7" font-size="28" font-weight="600">One assistant, explicit trust boundaries.</text>
<g><rect x="70" y="213" width="150" height="112" rx="14" fill="#11151c" stroke="#2a313d"/><text x="90" y="245" fill="#7f8897" font-size="11" letter-spacing="2">INPUT</text><text x="90" y="278" fill="#e9edf2" font-size="17">Voice + context</text><text x="90" y="302" fill="#8e98a7" font-size="12">VAD · ASR · memory</text></g>
<g><rect x="280" y="213" width="150" height="112" rx="14" fill="#11151c" stroke="#2a313d"/><text x="300" y="245" fill="#7f8897" font-size="11" letter-spacing="2">ROUTING</text><text x="300" y="278" fill="#e9edf2" font-size="17">Intelligence</text><text x="300" y="302" fill="#8e98a7" font-size="12">local · realtime · deep</text></g>
<g><rect x="490" y="213" width="150" height="112" rx="14" fill="#11151c" stroke="#a9b9ff"/><text x="510" y="245" fill="#a9b9ff" font-size="11" letter-spacing="2">TRUST</text><text x="510" y="278" fill="#e9edf2" font-size="17">Authorization</text><text x="510" y="302" fill="#8e98a7" font-size="12">identity · policy · scope</text></g>
<g><rect x="700" y="213" width="190" height="112" rx="14" fill="#11151c" stroke="#2a313d"/><text x="720" y="245" fill="#7f8897" font-size="11" letter-spacing="2">CAPABILITIES</text><text x="720" y="278" fill="#e9edf2" font-size="17">Trusted devices</text><text x="720" y="302" fill="#8e98a7" font-size="12">PC · phone · Pi · wearables</text></g>
<g fill="#a9b9ff"><circle cx="250" cy="269" r="4"/><circle cx="460" cy="269" r="4"/><circle cx="670" cy="269" r="4"/></g>
<text x="72" y="469" fill="#626b79" font-size="12">CURRENT REFERENCE IMPLEMENTATION</text>
<text x="72" y="497" fill="#c3cad4" font-size="15">Desktop first. Multi-device later. Security model stays consistent.</text>
</g></svg>
